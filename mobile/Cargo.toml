[package]
name = "anywhere-mobile"
description = "Lyrion Anywhere native host layer (Android, later iOS): API client, sign-in, events; exposed through UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "anywhere_mobile"
crate-type = ["lib", "cdylib"]

[features]
default = ["opus"]
# Opus decoding (the core's pure-Rust decoder); advertised to LMS as `ops`.
opus = ["anywhere-core/opus"]

[dependencies]
anywhere-core = { path = "../core", features = ["player", "resample"] }
uniffi = { version = "0.32", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "logging"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
log = "0.4"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
thiserror = "2"
getrandom = "0.4"
# SHA-256 for the offline folders' names (already in the tree through rustls).
ring = "0.17"

[target.'cfg(unix)'.dependencies]
# The monotonic clock AAudio's timestamps use (`clock_gettime(CLOCK_MONOTONIC)`).
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
# AAudio output (API 26+; the app's minimum is 29).
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-29"] }

[dev-dependencies]
webpki-root-certs = "1"
anywhere-gateway = { path = "../gateway" }
# The live sync check (tests/live_sync.rs) gives its gateway device the test player's MAC.
rusqlite = { version = "0.40", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# The TLS test's server side (tests/tls.rs); already in the tree through hyper-rustls.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
