[workspace]
resolver = "3"
members = ["core", "cli", "gateway", "wasm"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/JameZUK/lyrion-anywhere"

[profile.release]
lto = true
opt-level = 3

# Password hashing is deliberately expensive; keep tests fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
