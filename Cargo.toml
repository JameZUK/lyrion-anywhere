[workspace]
resolver = "3"
members = ["core", "cli", "gateway", "wasm", "mobile", "mobile/uniffi-bindgen"]
# Vendored third-party code: built as a dependency, not linted or formatted as ours.
exclude = ["third_party/opus-decoder"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/JameZUK/lyrion-anywhere"

[profile.release]
lto = true
opt-level = 3

# Release builds of the Android library (apps/android): release, with one codegen unit for
# a smaller, faster library. Panics stay `unwind`: the FFI layer catches them.
[profile.android-release]
inherits = "release"
codegen-units = 1

# Debug builds of the Android library (apps/android): unoptimised but without debug info,
# so the debug APK stays a sensible size.
[profile.android-dev]
inherits = "dev"
debug = false
strip = "debuginfo"

# Password hashing is deliberately expensive; keep tests fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# opus-decoder 0.1.1 with a fix for an overflow in the CELT decoder (see
# third_party/opus-decoder/PATCHES.md). Remove once a fixed release is published.
[patch.crates-io]
opus-decoder = { path = "third_party/opus-decoder" }
