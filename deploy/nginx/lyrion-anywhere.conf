# nginx in front of the Lyrion Anywhere gateway.
#
# Replace music.example.com, the certificate paths and the upstream address. The gateway
# sets its own security headers (CSP etc.); don't add a second CSP here.
#
# Gateway side:
#   --allowed-origin https://music.example.com
#   --trusted-proxy <this nginx host's address>   (not needed if nginx connects over loopback)
# If nginx itself sits behind a CDN (e.g. Cloudflare), set the real client address with the
# realip module (real_ip_header + set_real_ip_from the CDN's ranges) so $remote_addr below
# is the client, not the CDN.

upstream lyrion_anywhere {
    server 127.0.0.1:9443;          # the gateway's --listen address
    keepalive 16;
}

map $http_upgrade $anywhere_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name music.example.com;

    ssl_certificate     /etc/ssl/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/music.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Requests are small (sign-in, browse commands); audio only flows outwards.
    client_max_body_size 64k;

    location / {
        proxy_pass http://lyrion_anywhere;
        proxy_http_version 1.1;

        # WebSockets (player, events).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anywhere_connection;

        proxy_set_header Host $host;
        # Overwrite, never append: the gateway reads the first address, and an appended
        # list would let a client choose it (defeating sign-in rate limits).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";

        # Audio streams and sockets are long-lived and paced by the client: don't buffer
        # them, and don't time out a paused player.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
