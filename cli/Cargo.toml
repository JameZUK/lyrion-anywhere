[package]
name = "anywhere-cli"
description = "Native test player for the Lyrion Anywhere core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anywhere-core = { path = "../core" }
cpal = "0.18"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "__rustls-tls"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
serde_json = "1"
rustls-native-certs = "0.8"
