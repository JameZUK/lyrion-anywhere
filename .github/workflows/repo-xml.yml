name: Plugin repository URL

# LMS installs fetch plugin updates from releases/latest/download/repo.xml. GitHub's
# "latest" is one release: the plugin's `v*` releases take it, Android releases are
# published with --latest=false. Marking an Android release Latest (or a deleted plugin
# release letting GitHub choose afresh) makes that URL a 404 and every install silently
# stops seeing plugin updates. This fails loudly whenever a release changes, and weekly in
# case of a hand edit that sends no event. See docs/RELEASING.md.

on:
  release:
    types: [published, released, prereleased, edited, deleted]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: releases/latest/download/repo.xml is the plugin's
        env:
          CHECK_LATEST_TRIES: '6'
          CHECK_LATEST_DELAY: '20'
        run: tools/check-latest.sh
