name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install ALSA headers (cli audio output) and ffmpeg (live Opus encode tests)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ffmpeg
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (core with every optional feature)
        run: cargo clippy -p anywhere-core --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace
        env:
          # The live-encode tests with the real ffmpeg must run here, never skip.
          ANYWHERE_REQUIRE_FFMPEG: '1'
      - name: Core tests with optional features (Opus, resampler)
        run: cargo test -p anywhere-core --all-features
      - name: Robustness, limiter, analysis and performance tests (release, full matrices)
        run: cargo test -p anywhere-core --release --all-features --test robustness --test dsp_limiter --test analysis --test opus --test dsp_performance
      # The vendored decoder is its own workspace (third_party/opus-decoder/PATCHES.md), so
      # `cargo test --workspace` doesn't reach it. Shares the cached target directory.
      - name: Vendored Opus decoder tests (unit, no I/O, hostile packets)
        run: cargo test --locked --manifest-path third_party/opus-decoder/Cargo.toml
        env:
          CARGO_TARGET_DIR: target
      - name: Vendored Opus decoder hostile packets (release, full counts)
        run: cargo test --locked --release --manifest-path third_party/opus-decoder/Cargo.toml --test robustness
        env:
          CARGO_TARGET_DIR: target
      - name: Core builds for WebAssembly (proto only)
        run: cargo build -p anywhere-core --no-default-features --target wasm32-unknown-unknown

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Documentation links, anchors and images resolve
        run: python3 tools/check-docs.py --self-test && python3 tools/check-docs.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The builds run `npm ci --no-audit` (no network chatter mid-build); the audit is here
      # instead, against the lock file, and a high or critical advisory fails the job.
      - name: npm audit (high and critical fail)
        working-directory: web/app
        run: npm audit --audit-level=high
      - name: WASM binding tests (Node)
        run: wasm-pack test --node wasm
      - name: Build the web app (WebAssembly core + SvelteKit)
        run: tools/build-web.sh
      - name: Type check (strict, warnings fail)
        working-directory: web/app
        run: npm run check
      - name: Web app tests (Vitest + Node)
        working-directory: web/app
        run: npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android
      - name: Install cargo-ndk (pinned)
        run: cargo install --locked cargo-ndk --version 4.1.2
      - name: JDK 21 (preinstalled on the runner)
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-37.0"
      - name: Clippy for Android (the AAudio output only compiles there)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          cargo ndk -t arm64-v8a --platform 29 clippy -p anywhere-mobile --lib --locked -- -D warnings
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Build, unit tests and lint (all three ABIs)
        working-directory: apps/android
        run: ./gradlew assembleDebug testDebugUnitTest lint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reports
          path: apps/android/*/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lyrion-anywhere-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories bans sources
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny
      - name: The licence policy refuses GPL and LGPL dependencies (LICENSE-EXCEPTION)
        run: tools/test-deny-policy.sh

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the gateway (for the plugin/gateway contract test)
        run: cargo build -p anywhere-gateway
      - name: Plugin tests (Perl, against LMS stubs and the real gateway)
        working-directory: plugin
        env:
          ANYWHERE_REQUIRE_GATEWAY: '1'
          PERL5LIB: t/stubs:.
        run: prove -r t/
      - name: Settings page tests
        working-directory: plugin
        run: node --test t/js/*.test.mjs

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Docker image
        run: docker build -t lyrion-anywhere:test .
      - name: Image behind nginx with the example config
        run: tools/test-deploy.sh lyrion-anywhere:test

  release:
    # The full cross-build takes a while: run it on main and on tags, not on every branch.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # A release is published only when every other check passed.
    needs: [test, web, android, plugin, deploy, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Write access only here, and only used by the last steps, on version tags: contents for
    # the release, id-token and attestations for the signed build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the plugin release (three gateways, browser player)
        run: tools/build-release.sh
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64,arm
      - name: Check the release
        env:
          ANYWHERE_RUN_ARM: '1'
        run: tools/test-release.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-release
          path: |
            dist/*.zip
            dist/repo.xml
      # Signed provenance (Sigstore, recorded in GitHub's attestation store): which workflow,
      # commit and tag built these files. LMS checks only the SHA1 in repo.xml, which the
      # same release writes; `gh attestation verify` (docs/RELEASING.md) checks the build.
      - name: Attest the build provenance (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/repo.xml
      - name: Publish the GitHub release (version tags only)
        # Only after every other job passed for this tag.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' plugin/Plugins/LyrionAnywhere/install.xml)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME doesn't match install.xml version $version" >&2; exit 1; }
          # Plugin.pm reads its VERSION from install.xml (plugin/t/12-version.t); check it here too.
          pm=$(cd plugin && PERL5LIB=t/stubs:. perl -e 'package main; use constant WEBUI => 0; require Plugins::LyrionAnywhere::Plugin; print Plugins::LyrionAnywhere::Plugin::VERSION()')
          [ "$pm" = "$version" ] || { echo "Plugin.pm VERSION $pm doesn't match install.xml version $version" >&2; exit 1; }
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || { echo "missing $notes" >&2; exit 1; }
          (cd dist && sha256sum *.zip repo.xml > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Published by hand already (docs/RELEASING.md, building locally): leave it as it is.
            echo "::notice::release $GITHUB_REF_NAME already exists; not replacing it"
            exit 0
          fi
          # Explicitly Latest: LMS installs fetch releases/latest/download/repo.xml.
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/repo.xml dist/SHA256SUMS \
            --verify-tag --latest --title "Lyrion Anywhere $version" --notes-file "$notes"
      - name: Check LMS's repository URL serves this release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CHECK_LATEST_TRIES: '6'
          CHECK_LATEST_DELAY: '20'
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' plugin/Plugins/LyrionAnywhere/install.xml)
          tools/check-latest.sh --expect-version "$version"

  android-release:
    # Android releases come from `android-v*` tags only. (The plugin's `release` job above
    # publishes on `refs/tags/v*`, which `refs/tags/android-v*` never matches.) Built from
    # scratch without the shared caches, signed with the release key from the repository's
    # secrets (docs/RELEASING.md), and published as a pre-release, which it must stay: LMS
    # installs fetch plugin updates from releases/latest/download/repo.xml, and GitHub's
    # "latest" is the newest full release, so promoting an Android release would make that a
    # 404 for every install. The last step checks the URL still serves the plugin.
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [test, android, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Write access only here, and only used by the last steps: contents for the release,
    # id-token and attestations for the signed build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: '0'
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS: 36.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Install cargo-ndk (pinned)
        run: cargo install --locked cargo-ndk --version 4.1.2
      - name: JDK 21 (preinstalled on the runner)
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Android NDK, platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;$BUILD_TOOLS"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # A release never reads a cache that another branch could have written.
          cache-disabled: true
      - name: Check the tag, version and release notes
        run: |
          set -eu
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' apps/android/app/build.gradle.kts)
          [ -n "$version" ] || { echo "no versionName in apps/android/app/build.gradle.kts" >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "android-v$version" ] || { echo "tag $GITHUB_REF_NAME doesn't match versionName $version" >&2; exit 1; }
          [ -f "docs/release-notes/android-$version.md" ] || { echo "missing docs/release-notes/android-$version.md" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release signing key (from the repository's secrets)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -eu
          [ -n "$ANDROID_KEYSTORE_B64" ] || { echo "the ANDROID_KEYSTORE_B64 secret isn't set (docs/RELEASING.md)" >&2; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APKs (universal and per ABI) and the app bundle
        working-directory: apps/android
        env:
          ANYWHERE_KEYSTORE: ${{ runner.temp }}/release.jks
          ANYWHERE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANYWHERE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANYWHERE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Two runs: the Android Gradle plugin can't build per-ABI APKs and an app bundle in
        # one (issuetracker.google.com/402800800). The bundle run leaves the APKs in place.
        run: |
          ./gradlew --no-build-cache -Panywhere.splitApks=true assembleRelease
          ./gradlew --no-build-cache bundleRelease
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Check the signatures and collect the files
        run: |
          set -eu
          apksigner="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          out=apps/android/app/build/outputs
          mkdir -p dist-android
          for apk in "$out"/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-\(.*\)-release\.apk$/\1/')
            "$apksigner" verify --print-certs "$apk"
            if [ "$abi" = universal ]; then
              cp "$apk" "dist-android/LyrionAnywhere-android-$VERSION.apk"
            else
              cp "$apk" "dist-android/LyrionAnywhere-android-$VERSION-$abi.apk"
            fi
          done
          [ -f "dist-android/LyrionAnywhere-android-$VERSION.apk" ] || { echo "no universal APK" >&2; exit 1; }
          # No build-machine paths in the native library (they would reach crash reports).
          unzip -o -q "dist-android/LyrionAnywhere-android-$VERSION.apk" 'lib/*' -d "$RUNNER_TEMP/libs"
          if grep -r -a -l -e "$HOME" -e "$GITHUB_WORKSPACE" "$RUNNER_TEMP/libs"; then
            echo "build paths found in the native libraries" >&2; exit 1
          fi
          # The bundle: verified, and signed by the same certificate as the APKs. (Not
          # `jarsigner -strict`, which calls any self-signed key, as Android keys are, an error.)
          aab="$out/bundle/release/app-release.aab"
          jarsigner -verify "$aab" | grep -q '^jar verified' || { echo "the app bundle doesn't verify" >&2; exit 1; }
          expected=$("$apksigner" verify --print-certs "dist-android/LyrionAnywhere-android-$VERSION.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          got=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$expected" ] && [ "$expected" = "$got" ] || { echo "the app bundle isn't signed with the APKs' certificate" >&2; exit 1; }
          cp "$out/bundle/release/app-release.aab" "dist-android/LyrionAnywhere-android-$VERSION.aab"
          # What it was built with, for anyone reproducing the build (docs/RELEASING.md).
          {
            echo "commit: $GITHUB_SHA"
            rustc --version
            cargo ndk --version
            echo "ndk: $NDK_VERSION"
            java -version 2>&1 | head -1
          } > dist-android/BUILDINFO.txt
          (cd dist-android && sha256sum LyrionAnywhere-* BUILDINFO.txt > SHA256SUMS && cat SHA256SUMS)
      # Signed provenance for the APKs and the app bundle (docs/RELEASING.md).
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-android/LyrionAnywhere-android-*.apk
            dist-android/LyrionAnywhere-android-*.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: dist-android/
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Published by hand already (docs/RELEASING.md, building locally): leave it as it is.
            echo "::notice::release $GITHUB_REF_NAME already exists; not replacing it"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist-android/* \
            --verify-tag --prerelease --latest=false --title "Lyrion Anywhere for Android $VERSION" \
            --notes-file "docs/release-notes/android-$VERSION.md"
      - name: Check LMS's repository URL still serves the plugin
        env:
          CHECK_LATEST_TRIES: '6'
          CHECK_LATEST_DELAY: '20'
        run: tools/check-latest.sh
