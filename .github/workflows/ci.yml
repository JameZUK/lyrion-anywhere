name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers (cli audio output)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Robustness tests (release, more iterations)
        run: cargo test -p anywhere-core --release --test robustness
      - name: Core builds for WebAssembly (proto only)
        run: cargo build -p anywhere-core --no-default-features --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WASM binding tests (Node)
        run: wasm-pack test --node wasm
      - name: Build browser player
        run: tools/build-web-spike.sh
      - name: AudioWorklet tests
        run: node --test web/spike/tests/*.test.mjs

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the gateway (for the plugin/gateway contract test)
        run: cargo build -p anywhere-gateway
      - name: Plugin tests (Perl, against LMS stubs and the real gateway)
        working-directory: plugin
        env:
          ANYWHERE_REQUIRE_GATEWAY: '1'
          PERL5LIB: t/stubs:.
        run: prove -r t/
      - name: Settings page tests
        working-directory: plugin
        run: node --test t/js/*.test.mjs
