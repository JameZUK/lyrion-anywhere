[package]
name = "anywhere-wasm"
description = "WebAssembly bindings for the Lyrion Anywhere player core (browser player)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anywhere-core = { path = "../core", features = ["opus"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
