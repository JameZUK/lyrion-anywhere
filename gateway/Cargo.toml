[package]
name = "anywhere-gateway"
description = "Lyrion Anywhere gateway: authenticated Slimproto tunnel and stream relay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anywhere-core = { path = "../core", default-features = false, features = ["opus"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal", "fs", "process"] }
tower-http = { version = "0.7", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# TLS is rustls with the ring provider and bundled web roots (the Cloudflare Tunnel's download
# and API calls), as in mobile/: every client is built with that configuration, so there is
# no aws-lc-rs and no dependence on the system's certificate store.
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-root-certs = "1"
base64 = "0.22"
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
getrandom = "0.3"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.6"
hmac = "0.13"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(unix)'.dependencies]
# Signals, to stop cloudflared gracefully (and a stale one left by a killed gateway).
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls-no-provider"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
