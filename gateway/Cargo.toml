[package]
name = "anywhere-gateway"
description = "Lyrion Anywhere gateway: authenticated Slimproto tunnel and stream relay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anywhere-core = { path = "../core", default-features = false, features = ["opus"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal", "fs", "process"] }
tower-http = { version = "0.7", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
getrandom = "0.3"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.6"
hmac = "0.13"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["stream", "json"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
