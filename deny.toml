# cargo-deny: licence and advisory gate (run in CI).
#
# The project is GPL-2.0-or-later. Apache-2.0 code is compatible with GPLv3, so binaries
# containing it are distributed under GPLv3 terms. Copyleft-incompatible or proprietary
# licences (and anything unknown) are refused.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unlicense",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",          # Symphonia; MPL-2.0 permits combination with GPL-2.0
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.9

# Mozilla's root certificate data, used by rustls-platform-verifier on the phone apps
# (only as a fallback where the platform store is unavailable). CDLA-Permissive-2.0 is a
# permissive licence for data, allowed for this crate only.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
