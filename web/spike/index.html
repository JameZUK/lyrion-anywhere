<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyrion Anywhere — player spike</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Lyrion Anywhere</h1>
    <p class="note">Phase 1 browser player spike. This browser becomes an LMS player through the gateway.</p>

    <form id="login-form" autocomplete="on" hidden>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required spellcheck="false" autocapitalize="none">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="login" type="submit">Sign in</button>
    </form>

    <section id="start-panel" hidden>
      <p>Signed in as <strong id="who">–</strong>.</p>
      <button id="start" type="button">Start player</button>
      <button id="logout" type="button" class="secondary">Sign out</button>
    </section>

    <section id="player" hidden>
      <dl>
        <dt>Player</dt><dd id="s-name">–</dd>
        <dt>Connection</dt><dd id="s-conn">–</dd>
        <dt>State</dt><dd id="s-output">–</dd>
        <dt>Elapsed</dt><dd id="s-elapsed">–</dd>
        <dt>Buffered</dt><dd id="s-buffered">–</dd>
        <dt>Sample rate</dt><dd id="s-rate">–</dd>
        <dt>Audio context</dt><dd id="s-ctx">–</dd>
        <dt>Volume</dt><dd id="s-volume">–</dd>
      </dl>
      <p class="note">Control playback from LMS (or any LMS app) by choosing this player.</p>
      <button id="logout-player" type="button" class="secondary">Sign out</button>
    </section>

    <pre id="log" aria-live="polite"></pre>
  </main>
</body>
</html>
